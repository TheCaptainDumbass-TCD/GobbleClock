[workspace]
resolver = "2"
members = ["crates/*"]
default-members = ["crates/gc-core", "crates/gobbleclock"]

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.82"
authors = ["Dennis Ayotte <dennis@thecaptaindumbass.com>"]
license = "GPL-3.0-or-later"
publish = false

[profile.release]
lto = true
codegen-units = 1
