[package]
name = "gc-ui"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
gc-core = { path = "../gc-core" }
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
chrono = { version = "0.4", default-features = false, features = ["serde", "std", "clock", "wasmbind"] }
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlInputElement", "HtmlSelectElement", "HtmlTextAreaElement", "AudioContext", "AudioDestinationNode", "AudioNode", "AudioParam", "OscillatorNode", "OscillatorType", "GainNode", "BaseAudioContext", "AudioScheduledSourceNode", "console"] }
js-sys = "0.3"
